<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>루트52 11월 캐디 휴무</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: 고속도로 표지판 같은 진녹색 헤더 밴드 → 이름 검색 → 내 휴무 카드 → 전체표/날짜별 탭 */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --fg: #17241d;
  --muted: #5d6b63;
  --line: #dde3de;
  --brand: #111214;
  --brand-ink: #ffffff;
  --gold: #c9a24a;
  --off: #0f4a33;
  --off-ink: #ffffff;
  --sun: #c23b2e;
  --sat: #2a5ca8;
  --weekend: #eef2ee;
  --hl: #fff4d6;
  --t-a: #1f5fd6;  /* 추가휴무 */
  --t-p: #e86aa6;  /* 추(대기바꿈X) */
  --t-s: #d23a2a;  /* 병가 */
  --t-g: #1d9a52;  /* 추(당일X) */
  --t-x: #7a3fb0;  /* 휴무바꿈 */
  --f-display: "Oswald", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1612; --surface: #16211b; --fg: #e6ece8; --muted: #9aa9a0; --line: #2a3a31;
    --brand: #000000; --gold: #d9b45e; --off: #3f9c6d; --off-ink: #08130d;
    --sun: #ff7a6b; --sat: #7aa8ff; --weekend: #1b2921; --hl: #3a3218;
    --t-a: #5a8fff; --t-p: #f08cbc; --t-s: #ff6b5b; --t-g: #3fcf7c; --t-x: #b083e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1612; --surface: #16211b; --fg: #e6ece8; --muted: #9aa9a0; --line: #2a3a31;
  --brand: #000000; --gold: #d9b45e; --off: #3f9c6d; --off-ink: #08130d;
  --sun: #ff7a6b; --sat: #7aa8ff; --weekend: #1b2921; --hl: #3a3218;
  --t-a: #5a8fff; --t-p: #f08cbc; --t-s: #ff6b5b; --t-g: #3fcf7c; --t-x: #b083e0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body { overflow-x: clip; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
@media (min-width: 700px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

header.band { background: var(--brand); color: var(--brand-ink); }
header .wrap { padding-block: 22px 52px; display: flex; align-items: center; gap: 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
.shield { width: 76px; height: auto; flex: none; background: transparent; }
.brand-txt { min-width: 0; }
.eyebrow { font-family: var(--f-display); letter-spacing: .14em; font-size: 12px; color: var(--gold); text-transform: uppercase; }
h1 { margin: 2px 0 0; font-size: clamp(22px, 5vw, 30px); font-weight: 700; text-wrap: balance; }
h1 .num { font-family: var(--f-display); font-weight: 600; }
.sub { font-size: 13px; opacity: .8; }
.theme { margin-left: auto; align-self: flex-start; flex: none; white-space: nowrap; display: flex; border: 1px solid rgb(255 255 255 / .35); border-radius: 999px; padding: 3px; gap: 2px; }
.theme button { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-radius: 999px; padding: 6px 12px; background: transparent; color: #ffffff; cursor: pointer; }
.theme button[aria-pressed="true"] { background: #ffffff; color: #111214; }
.theme button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (max-width: 520px) { header .wrap { flex-wrap: wrap; row-gap: 10px; } .brand-txt { flex: 1 1 180px; } .theme button { padding: 5px 10px; } }

main .wrap { padding-block: 20px 48px; display: grid; gap: 20px; }

.search { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: -34px; box-shadow: 0 6px 20px rgb(0 0 0 / .08); }
.search label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
.search-row { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
.search input:focus { outline: none; border-color: var(--off); }
.search button { font: inherit; font-weight: 600; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.search button:focus-visible, .tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

.mine { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
.card-head h2 { margin: 0; font-size: 22px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--weekend); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip b { color: var(--fg); }
.total { margin-left: auto; font-family: var(--f-display); font-size: 30px; color: var(--off); line-height: 1; }
.total small { font-family: var(--f-body); font-size: 13px; color: var(--muted); margin-left: 2px; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.cal .dow.s0 { color: var(--sun); } .cal .dow.s6 { color: var(--sat); }
.cal .d { aspect-ratio: 1 / .82; max-width: 100%; border-radius: 8px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; font-size: 14px; position: relative; }
.cal .d.s0 .n { color: var(--sun); } .cal .d.s6 .n { color: var(--sat); }
.cal .d.off { background: var(--off); color: var(--off-ink); font-weight: 700; }
.cal .d.off .n { color: inherit; }
.cal .d .tag { font-size: 10.5px; line-height: 1.1; font-weight: 600; }
.cal .d.other { background: var(--hl); }
.cal .d .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; }
.datelist { font-size: 14px; color: var(--muted); }
.datelist b { color: var(--fg); }

.empty { color: var(--muted); font-size: 14px; padding: 4px 2px; }

.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--line); }
.tab { font: inherit; font-weight: 600; background: none; border: 0; padding: 10px 14px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--off); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-height: 75vh; }
table { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); text-align: center; padding: 0; height: 32px; white-space: nowrap; }
thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; font-weight: 600; padding: 4px 0; height: auto; }
thead th .wd { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); }
th.s0, th.s0 .wd { color: var(--sun); } th.s6, th.s6 .wd { color: var(--sat); }
td.wk { background: var(--weekend); }
.c-no, .c-name { position: sticky; background: var(--surface); z-index: 1; }
thead .c-no, thead .c-name { z-index: 3; }
.c-no { left: 0; width: 36px; min-width: 36px; color: var(--muted); }
.c-name { left: 36px; min-width: 70px; text-align: left; padding: 0 8px; font-weight: 600; border-right: 1px solid var(--line); }
.c-cart, .c-tot { padding: 0 8px; color: var(--muted); }
.c-tot { font-weight: 700; color: var(--fg); border-left: 1px solid var(--line); }
td.day { width: 30px; min-width: 30px; }
.off-mark { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 22px; border-radius: 5px; background: var(--off); color: var(--off-ink); font-size: 11.5px; font-weight: 700; }
.txt-mark { font-size: 10.5px; font-weight: 700; padding: 2px 3px; border-radius: 4px; background: var(--hl); color: var(--fg); }
tr.match td { background: var(--hl); }
tr.match td.c-no, tr.match td.c-name { background: var(--hl); }
tbody tr:hover td { background: var(--hl); }
tfoot td { font-weight: 700; position: sticky; bottom: 0; background: var(--surface); border-top: 2px solid var(--line); }
tfoot td.c-name { font-size: 12px; }

.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.daypick button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-variant-numeric: tabular-nums; }
.daypick button .c { font-size: 11px; color: var(--muted); }
.daypick button.s0 .n { color: var(--sun); } .daypick button.s6 .n { color: var(--sat); }
.daypick button[aria-pressed="true"] { background: var(--off); border-color: var(--off); color: var(--off-ink); }
.daypick button[aria-pressed="true"] .n, .daypick button[aria-pressed="true"] .c { color: inherit; }
.daypick .blank { visibility: hidden; }
.dayout { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.dayout h3 { margin: 0; font-size: 17px; }
.names { display: flex; flex-wrap: wrap; gap: 6px; }
.names span { padding: 5px 10px; border-radius: 999px; background: var(--weekend); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.names span em { font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 휴대폰용 전체표: 사람별 카드 목록 */
.plist { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.prow { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.prow:last-child { border-bottom: 0; }
.prow-head { display: flex; align-items: baseline; gap: 8px; }
.prow-head .no { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 22px; }
.prow-head .nm { font-weight: 700; font-size: 16px; }
.prow-head .tt { margin-left: auto; font-size: 13px; color: var(--muted); }
.prow-head .tt b { font-family: var(--f-display); font-size: 18px; color: var(--off); margin-right: 1px; }
.pdays { display: flex; flex-wrap: wrap; gap: 5px; }
.pd { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 38px; padding: 3px 4px; border-radius: 7px; background: var(--off); color: var(--off-ink); line-height: 1.15; font-variant-numeric: tabular-nums; }
.pd .dn { font-weight: 700; font-size: 14px; }
.pd .dw { font-size: 10.5px; opacity: .85; }
.pd.etc { background: var(--hl); color: var(--fg); }
.pd.etc .dw { font-weight: 600; }
.prow.match { background: var(--hl); }

footer { font-size: 12px; color: var(--muted); }
@media (max-width: 640px) {
  .tablebox { display: none; }
  .plist { display: block; }
  header .wrap { padding-block: 16px 20px; gap: 12px; }
  .search { margin-top: 0; box-shadow: none; }
  .shield { width: 60px; }
  h1 { font-size: 21px; }
  .sub { font-size: 12px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; }
  .tab { padding: 12px 0; font-size: 15px; }
  .cal .d { font-size: 13px; }
}
@media (max-width: 520px) {
  .search { padding: 14px; }
  .total { font-size: 26px; }
  .c-cart { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .tab, .daypick button { transition: background .15s, color .15s; } }
</style>

8,"휴","n"]]},{"no":61,"name":"김혜미","cart":"55","total":8,"days":[[2,"조출","n"],[4,"휴","n"],[9,"휴","n"],[10,"휴","n"],[16,"휴","n"],[18,"휴","n"],[19,"휴","n"],[27,"휴","a"],[28,"휴","n"]]},{"no":62,"name":"김나경","cart":"64","total":8,"days":[[4,"휴","n"],[9,"휴","n"],[10,"휴","n"],[17,"휴","x"],[19,"휴","x"],[22,"휴","a"],[27,"휴","x"],[28,"휴","n"]]},{"no":63,"name":"이준영","cart":"5","total":11,"days":[[1,"휴","a"],[2,"휴","s"],[3,"휴","s"],[4,"휴","s"],[5,"휴","n"],[11,"휴","n"],[12,"휴","n"],[17,"휴","n"],[23,"휴","n"],[29,"휴","n"],[30,"휴","x"]]},{"no":64,"name":"장지혜","cart":"19","total":9,"days":[[2,"휴","n"],[3,"휴","n"],[8,"휴","n"],[14,"휴","n"],[15,"휴","n"],[17,"휴","x"],[20,"휴","n"],[26,"휴","n"],[27,"휴","n"]]},{"no":65,"name":"임은주","cart":"40","total":8,"days":[[4,"휴","n"],[5,"휴","x"],[9,"휴","n"],[10,"휴","n"],[16,"휴","n"],[22,"휴","n"],[28,"휴","n"],[29,"휴","a"]]},{"no":66,"name":"최준혁","cart":"3순위","total":6,"days":[[6,"휴","x"],[13,"휴","x"],[19,"휴","n"],[25,"휴","n"],[26,"휴","n"],[30,"휴","x"]]},{"no":67,"name":"김초목","cart":"3순위","total":8,"days":[[1,"휴","n"],[6,"휴","n"],[7,"휴","n"],[13,"휴","n"],[18,"휴","n"],[19,"휴","n"],[25,"휴","n"],[30,"휴","n"]]},{"no":68,"name":"김수진","cart":"6순위","total":8,"days":[[6,"휴","n"],[9,"휴","x"],[13,"휴","n"],[18,"휴","n"],[25,"휴","n"],[26,"휴","p"],[27,"휴","p"],[30,"휴","n"]]},{"no":69,"name":"강민","cart":"5순위","total":6,"days":[[5,"휴","n"],[6,"휴","n"],[11,"휴","n"],[17,"휴","n"],[18,"휴","a"],[24,"휴","n"]]},{"no":70,"name":"이지현","cart":"7순위","total":8,"days":[[4,"휴","n"],[10,"휴","n"],[16,"휴","n"],[17,"휴","n"],[18,"휴","n"],[21,"휴","n"],[22,"휴","n"],[23,"휴","a"]]},{"no":71,"name":"조정은","cart":"8순위","total":6,"days":[[4,"반납/찾","n"],[9,"휴","n"],[10,"휴","n"],[16,"휴","n"],[21,"휴","n"],[22,"휴","n"],[28,"휴","n"]]},{"no":72,"name":"곽윤미","cart":"","total":15,"days":[[2,"휴","n"],[3,"휴","n"],[4,"휴","n"],[5,"휴","n"],[6,"휴","n"],[9,"휴","n"],[10,"휴","n"],[11,"휴","n"],[12,"휴","n"],[13,"휴","n"],[16,"휴","n"],[17,"휴","n"],[18,"휴","n"],[19,"휴","n"],[20,"휴","n"],[23,"휴","n"],[24,"휴","n"],[25,"휴","n"],[26,"휴","n"],[27,"휴","n"],[30,"휴","n"]]}];
const DAYS = 30, FIRST_DOW = 0; // 2026-11-01 = 일요일
const WD = ['일','월','화','수','목','금','토'];
const TYPES = {
  n: { label: '휴무', color: 'var(--off)' },
  a: { label: '추가휴무', color: 'var(--t-a)' },
  p: { label: '추(대기바꿈X)', color: 'var(--t-p)' },
  g: { label: '추(당일X)', color: 'var(--t-g)' },
  s: { label: '병가', color: 'var(--t-s)' },
  x: { label: '휴무바꿈', color: 'var(--t-x)' }
};
const dow = d => (FIRST_DOW + d - 1) % 7;
const isOff = v => v === '휴';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cartLabel = c => c === '' ? '-' : (/순위/.test(c) ? c : c + '번');

DATA.forEach(p => { p.map = {}; p.days.forEach(([d, v, t]) => p.map[d] = { v, t }); });

// legend
document.getElementById('legend').innerHTML = Object.values(TYPES).map(t =>
  `<span><i class="sw" style="background:${t.color}"></i>${t.label}</span>`).join('') +
  `<span><i class="sw" style="background:var(--hl);border:1px solid var(--line)"></i>당번·조출·후출·찾근·반납</span>`;

function markHTML(cell) {
  if (!cell) return '';
  if (isOff(cell.v)) {
    const t = TYPES[cell.t] || TYPES.n;
    return `<span class="off-mark" style="background:${t.color}" title="${t.label}">휴</span>`;
  }
  return `<span class="txt-mark">${esc(cell.v)}</span>`;
}

// full grid
function buildGrid() {
  let h = '<thead><tr><th class="c-no">순번</th><th class="c-name">이름</th><th class="c-cart">카트</th>';
  for (let d = 1; d <= DAYS; d++) h += `<th class="s${dow(d)}">${d}<span class="wd">${WD[dow(d)]}</span></th>`;
  h += '<th class="c-tot">합계</th></tr></thead><tbody>';
  DATA.forEach(p => {
    h += `<tr data-no="${p.no}"><td class="c-no">${p.no}</td><td class="c-name">${esc(p.name)}</td><td class="c-cart">${esc(cartLabel(p.cart))}</td>`;
    for (let d = 1; d <= DAYS; d++) {
      const w = dow(d); h += `<td class="day${w === 0 || w === 6 ? ' wk' : ''}">${markHTML(p.map[d])}</td>`;
    }
    h += `<td class="c-tot">${p.total}</td></tr>`;
  });
  h += '</tbody><tfoot><tr><td class="c-no"></td><td class="c-name">휴무 인원</td><td class="c-cart"></td>';
  for (let d = 1; d <= DAYS; d++) h += `<td>${offOn(d).length}</td>`;
  h += '<td class="c-tot"></td></tr></tfoot>';
  document.getElementById('grid').innerHTML = h;

  // 휴대폰용 목록
  document.getElementById('plist').innerHTML = DATA.map(p => {
    const chips = [];
    for (let d = 1; d <= DAYS; d++) {
      const c = p.map[d]; if (!c) continue;
      const w = WD[dow(d)];
      if (isOff(c.v)) {
        const t = TYPES[c.t] || TYPES.n;
        chips.push(`<span class="pd" style="background:${t.color}" title="${t.label}"><span class="dn">${d}</span><span class="dw">${w}</span></span>`);
      } else chips.push(`<span class="pd etc"><span class="dn">${d}</span><span class="dw">${esc(c.v)}</span></span>`);
    }
    return `<div class="prow" data-no="${p.no}">
      <div class="prow-head"><span class="no">${p.no}</span><span class="nm">${esc(p.name)}</span><span class="tt"><b>${p.total}</b>일</span></div>
      <div class="pdays">${chips.join('') || '<span class="empty">휴무 없음</span>'}</div>
    </div>`;
  }).join('');
}
const offOn = d => DATA.filter(p => p.map[d] && isOff(p.map[d].v));

// my schedule
function renderMine(q) {
  const box = document.getElementById('mine');
  document.querySelectorAll('#grid tr.match').forEach(r => r.classList.remove('match'));
  q = q.trim();
  const hits = q ? DATA.filter(p => p.name.includes(q)) : DATA;
  const keep = new Set(hits.map(p => String(p.no)));
  document.querySelectorAll('#grid tbody tr, #plist .prow').forEach(r => { r.hidden = !keep.has(r.dataset.no); });
  document.querySelector('#grid tfoot').hidden = !!q;
  if (!q) { box.innerHTML = ''; return; }
  if (!hits.length) { box.innerHTML = `<div class="card"><div class="empty">"${esc(q)}" 이름을 11월 휴무표에서 찾지 못했어요. 이름을 다시 확인해 주세요.</div></div>`; return; }
  box.innerHTML = hits.map(p => {
    let cal = WD.map((w, i) => `<div class="dow s${i}">${w}</div>`).join('');
    for (let i = 0; i < FIRST_DOW; i++) cal += '<div></div>';
    const offDates = [], others = [];
    for (let d = 1; d <= DAYS; d++) {
      const c = p.map[d], w = dow(d);
      if (c && isOff(c.v)) {
        const t = TYPES[c.t] || TYPES.n;
        offDates.push(`${d}일(${WD[w]})`);
        cal += `<div class="d off s${w}" style="background:${t.color}" title="${t.label}"><span class="n">${d}</span><span class="tag">${c.t === 'n' ? '휴무' : t.label.replace('(대기바꿈X)', '').replace('(당일X)', '')}</span></div>`;
      } else if (c) {
        others.push(`${d}일 ${esc(c.v)}`);
        cal += `<div class="d other s${w}"><span class="n">${d}</span><span class="tag">${esc(c.v)}</span></div>`;
      } else cal += `<div class="d s${w}"><span class="n">${d}</span></div>`;
    }
    return `<article class="card">
      <div class="card-head">
        <h2>${esc(p.name)}</h2>
        <div class="meta"><span class="chip">순번 <b>${p.no}</b></span><span class="chip">카트 <b>${esc(cartLabel(p.cart))}</b></span></div>
        <div class="total">${p.total}<small>일 휴무</small></div>
      </div>
      <div class="cal">${cal}</div>
      <div class="datelist"><b>휴무일</b> ${offDates.join(', ') || '없음'}${others.length ? `<br><b>기타</b> ${others.join(', ')}` : ''}</div>
    </article>`;
  }).join('');
  hits.forEach(p => { const r = document.querySelector(`#grid tr[data-no="${p.no}"]`); if (r) r.classList.add('match'); });
}

// by-day view
let selDay = 1;
function buildDayPick() {
  const today = new Date();
  if (today.getFullYear() === 2026 && today.getMonth() === 10) selDay = today.getDate();
  let h = WD.map((w, i) => `<div class="dow" style="text-align:center;font-size:12px;font-weight:600;color:${i === 0 ? 'var(--sun)' : i === 6 ? 'var(--sat)' : 'var(--muted)'}">${w}</div>`).join('');
  for (let i = 0; i < FIRST_DOW; i++) h += '<span class="blank"></span>';
  for (let d = 1; d <= DAYS; d++) h += `<button type="button" id="dp${d}" class="s${dow(d)}" data-d="${d}" aria-pressed="${d === selDay}"><span class="n">${d}</span><span class="c">${offOn(d).length}명</span></button>`;
  const el = document.getElementById('daypick');
  el.innerHTML = h;
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    selDay = +b.dataset.d;
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    renderDay();
  });
  renderDay();
}
function renderDay() {
  const list = offOn(selDay);
  const duty = DATA.filter(p => p.map[selDay] && !isOff(p.map[selDay].v));
  document.getElementById('dayout').innerHTML = `
    <h3>11월 ${selDay}일 (${WD[dow(selDay)]}) 휴무 ${list.length}명</h3>
    <div class="names">${list.map(p => { const t = TYPES[p.map[selDay].t] || TYPES.n; return `<span><i class="sw" style="background:${t.color}" title="${t.label}"></i>${esc(p.name)}<em>${p.no}</em></span>`; }).join('') || '<span class="empty">휴무자가 없습니다</span>'}</div>
    ${duty.length ? `<div class="datelist"><b>기타</b> ${duty.map(p => esc(p.name) + ' ' + esc(p.map[selDay].v)).join(', ')}</div>` : ''}`;
}

// tabs
const tabs = { all: document.getElementById('tab-all'), day: document.getElementById('tab-day') };
function showTab(k) {
  Object.entries(tabs).forEach(([n, b]) => b.setAttribute('aria-selected', n === k));
  document.getElementById('view-all').hidden = k !== 'all';
  document.getElementById('view-day').hidden = k !== 'day';
  try { localStorage.setItem('r52-tab', k); } catch (e) {}
}
tabs.all.onclick = () => showTab('all');
tabs.day.onclick = () => showTab('day');

// theme
function setTheme(t, save) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
  if (save) { try { localStorage.setItem('r52-theme', t); } catch (e) {} }
}
document.querySelectorAll('.theme button').forEach(b => b.onclick = () => setTheme(b.dataset.t, true));
let savedTheme = null;
try { savedTheme = localStorage.getItem('r52-theme'); } catch (e) {}
setTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), false);

buildGrid();
buildDayPick();

const q = document.getElementById('q');
q.addEventListener('input', () => { renderMine(q.value); try { localStorage.setItem('r52-name', q.value.trim()); } catch (e) {} });
document.getElementById('clear').onclick = () => { q.value = ''; renderMine(''); try { localStorage.removeItem('r52-name'); } catch (e) {} q.focus(); };
try {
  const saved = localStorage.getItem('r52-name'); if (saved) { q.value = saved; renderMine(saved); }
  const t = localStorage.getItem('r52-tab'); if (t === 'day') showTab('day');
} catch (e) {}
</script>

</body></html>
